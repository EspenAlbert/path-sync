message: 'fix(copy): match exclude_dirs only below the repo root


  PathMapping.is_excluded checked every part of the absolute path, so a

  source or destination repo inside a folder named venv, node_modules,

  .tox, etc. had every file excluded and copy, pull and prune synced

  nothing. Callers now pass the path relative to the repo root.


