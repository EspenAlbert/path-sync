message: 'fix(repo_utils): keep a non-git destination folder unless the user confirms


  ensure_repo removed a non-git destination folder even when no repo_url

  was configured (then failed), and auto-confirmed the removal when stdin

  was not a terminal. Now it raises without a repo_url, and asks with

  prompt_pull_confirm, which declines in non-interactive runs.


