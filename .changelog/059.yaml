changelog_message: 'fix: write LF and translate line endings of text read from git'
group: __ROOT__
message: "fix: write LF and translate line endings of text read from git\n\nText path_sync reads from the working tree has LF line endings\n(Path.read_text translates CRLF and CR), but:\n\n- ensure_parents_write_text wrote os.linesep, so on Windows every file\n  path_sync copied, pulled, or merged became CRLF, whatever its line\n  endings were before. Write LF, as on Linux and macOS.\n- get_file_content_at_ref and file_content_at_commit returned the\n  blob's raw line endings. A CRLF blob (committed without autocrlf)\n  hid every section marker from the section parser, so\n  validate-no-changes reported the whole file instead of the changed\n  section, or failed a file whose fenced sections were unchanged, and\n  merge misclassified changes against the base. Translate CRLF and CR\n  to LF. get_file_content_at_ref also keeps the final newline now\n  (strip_newline_in_stdout=False, as file_content_at_commit already\n  did); otherwise a CRLF blob ended in a stray CR, and an LF blob\n  compared\
  \ unequal to the same file read from disk.\n\nOn Windows this fixes 16 of the 18 tests that failed there; the other\ntwo fail on the path separator in dest_key, which is a separate bug.\n8 of the 9 new tests fail before this commit on Windows, 7 on Linux\n(writing LF already worked there).\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
