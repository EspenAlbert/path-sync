message: 'fix: decode git, gh, and verify-step output as UTF-8


  subprocess.run(text=True) decoded output with the locale encoding. On

  Windows with Python 3.13 and 3.14 that is the ANSI code page (cp1252),

  but git and gh write UTF-8: PR bodies, URLs, and error messages came

  back as mojibake, or raised UnicodeDecodeError (e.g. for "Á"), and

  _fetch_origin could crash on output it discards.


  Pass encoding="utf-8" to every subprocess.run in git_ops and

  auto_merge. Verify steps run arbitrary user commands whose output is

  only logged, so run_command also uses errors="replace".


  Tests: locale_cp1252 now also covers subprocess._text_encoding, and the

  commands_print_utf8 fixture makes subprocess.run run a command that

  prints UTF-8. All 22 new tests fail on main.


  Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>'
